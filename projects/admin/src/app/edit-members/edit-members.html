<a9-navigate-back-button></a9-navigate-back-button>
<hlm-card *transloco="let t" class="max-w-2xl">
  <hlm-card-header>
    <h3 hlmCardTitle>
      {{ t('Edit members of *username', { username: username()}) }}
    </h3>
  </hlm-card-header>

  <div hlmCardContent>
    <a9-http-resource-viewer [resource]="memberships" defaultErrorHandler="true"
      class="flex flex-col gap-2 divide-y divide-primary/50">
      @if(memberships.hasValue()) {
      @let ms = memberships.value()!;
      @for(grp of ms.groups; track grp.group.uri) {
      <div class="mb-4">
        <div class="py-2" [class]="hlmGroup">{{grp.group.displayname}}</div>
        <cal-lookup-principal [label]="t('Add principal')" (principal)="add($event, grp)"></cal-lookup-principal>
        <div class="flex flex-col gap-1 mb-6 pt-1">
          @for(m of grp.members; track m.username) {
          <hlm-item variant="outline" size="xs">
            <hlm-item-media>
              <cal-icon-principal-type [type]="m.principalType"></cal-icon-principal-type>
            </hlm-item-media>
            <hlm-item-content>
              <hlm-item-title>
                <span [class.line-through]="m.membershipType === 'Unassigned'">{{ m.displayname}}</span>
              </hlm-item-title>
            </hlm-item-content>
            <hlm-item-actions>
              <button hlmBtn [variant]="m.membershipType !== 'Unassigned'? 'destructive' : 'ghost'" class="rounded-full" size="icon-sm"
                (click)="remove(m, grp)">
                <ng-icon
                  [name]="m.membershipType !== 'Unassigned' ? 'matDeleteOutline' : 'matRestoreFromTrashFillOutline'" />
              </button>
            </hlm-item-actions>
          </hlm-item>
          }
        </div>
      </div>
      }
      }
    </a9-http-resource-viewer>
    @if(formMessage()) {
    <a9-hint-box mode="error">
      <a9-http-error-on-save [error]="formMessage()"></a9-http-error-on-save>
    </a9-hint-box>
    }
  </div>

  <hlm-card-footer>
    <hlm-button-group>
      <button hlmBtn variant="default" [disabled]="!dirty()" (click)="submit()" type="button">{{ t('Save') }}</button>
      <button hlmBtn variant="ghost" size="icon" type="reset" (click)="refresh()" [title]="t('Reset')">
        <ng-icon name="matRestartAltOutline" />
      </button>
    </hlm-button-group>
  </hlm-card-footer>
  <!-- <pre>{{ members()|json}}</pre> -->
</hlm-card>
