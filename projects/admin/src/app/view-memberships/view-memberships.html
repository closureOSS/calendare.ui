<hlm-card class="[--card-spacing:--spacing(4)] max-w-5xl" *transloco="let t">
  <hlm-card-header>
    <h3 hlmCardTitle><ng-content></ng-content></h3>
  </hlm-card-header>
  <div hlmCardContent>
    <a9-http-resource-viewer [resource]="memberships" class="flex flex-wrap gap-2 divide-accent divide-x-4">
      @if(memberships.hasValue()) {
      @let ms = memberships.value();
      @for(m of ms?.memberships; track m.uri) {
      <hlm-item variant="outline" size="xs" class="max-w-fit cursor-pointer"
        [routerLink]="['/principal', 'show', m.username]">
        <hlm-item-media>
          <cal-icon-principal-type [type]="m.principalType"></cal-icon-principal-type>
        </hlm-item-media>
        <hlm-item-content>
          <hlm-item-title>
            {{ m.displayname }}
          </hlm-item-title>
        </hlm-item-content>
      </hlm-item>
      } @empty {
      <a9-hint-box mode="warning" class="w-full" compact>{{ t('No memberships exist.') }}</a9-hint-box>
      }
      }
    </a9-http-resource-viewer>
  </div>
</hlm-card>
