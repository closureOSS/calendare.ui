<article *transloco="let t">
  <a9-site-title>{{ t('Addressbooks') }}</a9-site-title>

  <section>
    @if(username(); as username) {
    @if(principal && principal.hasValue()) {
    @let prin = principal.value();
    <cal-view-collections [username]="username" [filterType]="CollectionType.Addressbook" [filterTechnical]="true"
      [principalType]="prin.principalType"></cal-view-collections>
    @if(!prin.isRoot) {
    <a9-floating-action-bar>
      <button hlmBtn variant="secondary" size="icon-lg"
        [disabled]="!hasPermission(prin.permissions, PrivilegeMask.Bind)"
        [routerLink]="['/collection', 'create', username, CollectionType.Addressbook]">
        <ng-icon name="matContactsFillOutline" data-icon="inline-start"></ng-icon>
      </button>
    </a9-floating-action-bar>
    }
    }
    }
  </section>
</article>
