<ng-container *transloco="let t">
  <form [formRoot]="editForm">
    <hlm-card class="max-w-3xl">
      <hlm-card-header>
        <h3 hlmCardTitle>{{ t('Confirm *emailaddress', {emailaddress: principal().email}) }}</h3>
      </hlm-card-header>
      <div hlmCardContent>
        <div class="a9-form">
          <hlm-field>
            <label hlmFieldLabel>{{ t('Email confirmation code') }}</label>
            <input hlmInput [formField]="editForm.confirmationToken" type="text"
              [placeholder]="t('Email confirmation code')">
            <a9-field-error [field]="editForm.confirmationToken()">
              {{ t('Enter the confirmation code received by e-mail') }}
            </a9-field-error>
          </hlm-field>
        </div>

        <a9-form-error [errors]="editForm().getError('serverError')"></a9-form-error>
      </div>
      <hlm-card-footer>
        <button hlmBtn variant="default" [disabled]="editForm().submitting()" type="submit">{{ t('Confirm') }}</button>
        <button hlmBtn variant="ghost" (click)="resend()" type="button">{{ t('Send again') }}</button>
      </hlm-card-footer>
    </hlm-card>
  </form>
</ng-container>
