<ng-container *transloco="let t">
  <form [formRoot]="editForm">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ t('Confirm *emailaddress', {emailaddress: principal().email}) }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="a9-form">
          <mat-form-field>
            <mat-label>{{ t('Email confirmation code') }}</mat-label>
            <input matInput [formField]="editForm.confirmationToken" type="text"
              [placeholder]="t('Email confirmation code')">
            <mat-hint>{{ t('Enter the confirmation code received by e-mail') }}</mat-hint>
            <mat-error [field]="editForm.confirmationToken()"></mat-error>
          </mat-form-field>
        </div>
        @if(editForm().getError('serverError')) {
        <a9-hint-box class="a9-form-msg" mode="error" [slim]="true">{{ editForm().getError('serverError')?.message
          }}</a9-hint-box>
        }
      </mat-card-content>
      <mat-card-actions>
        <a9-action-bar class="separate">
          <button matButton="filled" type="submit">{{ t('Confirm') }}</button>
          <button matButton="outlined" type="button" (click)="resend()">{{ t('Send again') }}</button>
        </a9-action-bar>
      </mat-card-actions>
    </mat-card>
  </form>
</ng-container>
