<hlm-card class="[--card-spacing:--spacing(4)] max-w-5xl">
  <hlm-card-header>
    <h3 hlmCardTitle><ng-content></ng-content></h3>
  </hlm-card-header>
  <div hlmCardContent>
    <a9-http-resource-viewer [resource]="privileges">
      <cal-list-privileges [privilegeGroups]="privileges.value()?.privilegeGroups??[]" [direction]="false"
        (doRevoke)="refuse($event)" revoke="Refuse" [editable]="editable()"></cal-list-privileges>
    </a9-http-resource-viewer>
  </div>
</hlm-card>
