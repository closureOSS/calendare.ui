<a9-navigate-back-button></a9-navigate-back-button>
<form [formRoot]="editForm" *transloco="let t">
  <hlm-card class="max-w-3xl">
    <hlm-card-header>
      <h3 hlmCardTitle>{{ t('Create appkey credential for *username', {username: username()}) }}</h3>
    </hlm-card-header>
    <div hlmCardContent>
      <hlm-field-group>
        <hlm-field>
          <label hlmFieldLabel for="description">{{ t('Label/description') }}</label>
          <input hlmInput id="description" [formField]="editForm.description" type="text"
            [placeholder]="t('ApplicationKey_Description_Hint')">
          <a9-field-error [field]="editForm.description()">
            {{ t('ApplicationKey_Description_Hint') }}
          </a9-field-error>
        </hlm-field>
        <fieldset hlmFieldSet>
          <legend hlmLabel class="py-4">{{ t('Scope') }}</legend>
          <hlm-radio-group [formField]="editForm.scope" class="max-w-sm">
            <label hlmFieldLabel for="scope-255">
              <hlm-field orientation="horizontal">
                <hlm-radio [value]="255" inputId="scope-255">
                  <hlm-radio-indicator indicator />
                </hlm-radio>
                <hlm-field-title>{{ t('Scope_Unrestricted') }}</hlm-field-title>
              </hlm-field>
            </label>
            <label hlmFieldLabel for="scope-1">
              <hlm-field orientation="horizontal">
                <hlm-radio [value]="1" inputId="scope-1">
                  <hlm-radio-indicator indicator />
                </hlm-radio>
                <hlm-field-title>{{ t('Scope_DAV') }}</hlm-field-title>
              </hlm-field>
            </label>
            <label hlmFieldLabel for="scope-2">
              <hlm-field orientation="horizontal">
                <hlm-radio [value]="2" inputId="scope-2">
                  <hlm-radio-indicator indicator />
                </hlm-radio>
                <hlm-field-title>{{ t('Scope_Api') }}</hlm-field-title>
              </hlm-field>
            </label>
          </hlm-radio-group>
          <a9-field-error [field]="editForm.scope()"></a9-field-error>
        </fieldset>
        <a9-form-error [errors]="editForm().getError('serverError')"></a9-form-error>
      </hlm-field-group>
    </div>
    <hlm-card-footer>
      <div hlmButtonGroup>
        <button hlmBtn variant="default" tabindex="0" type="submit">{{ t('Create') }}</button>
      </div>
    </hlm-card-footer>
  </hlm-card>
</form>
