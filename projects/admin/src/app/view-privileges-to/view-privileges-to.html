<hlm-card class="[--card-spacing:--spacing(4)] max-w-5xl" *transloco="let t">
  <hlm-card-header>
    <h3 hlmCardTitle><ng-content></ng-content></h3>
  </hlm-card-header>
  <div hlmCardContent>
    <a9-http-resource-viewer [resource]="privileges">
      @if(privileges.hasValue()) {
      <cal-list-privileges [privilegeGroups]="privileges.value()?.privilegeGroups ?? []"
        [direction]="true"></cal-list-privileges>
      }
    </a9-http-resource-viewer>
  </div>
  <hlm-card-footer>
    <hlm-button-group>
      <button hlmBtn variant="outline" [routerLink]="['/principal', 'privileges', username()]">{{ t('Edit') }}</button>
      <button hlmBtn variant="outline" (click)="refresh()">{{ t('Refresh') }}</button>
      <button hlmBtn variant="outline" (click)="recalc()">{{ t('Recalc') }}</button>
      @if(privileges.value(); as priv) {
      @if(priv?.hasProxyReadCollection || priv?.hasProxyWriteCollection) {
      <span class="text-muted-foreground self-center-safe pl-4">{{ t('(Privilege proxies exists)') }}</span>
      }
      }
    </hlm-button-group>
  </hlm-card-footer>
</hlm-card>
