<form [formRoot]="editForm" *transloco="let t">
  <hlm-card class="max-w-3xl">
    <hlm-card-header>
      <div class="flex items-center gap-3 w-full">
        <cal-icon-principal-type size="2.25rem"
          [type]="$safeNavigationMigration(principal.value()?.principalType?.label)"></cal-icon-principal-type>
        <div>
          <h3 hlmCardTitle>
            {{ principal.value()?.username }} &ndash;
            {{ principal.value()?.displayName }}
          </h3>
          <p hlmCardDescription>{{ principal.value()?.principalType?.name }}</p>
        </div>
      </div>
    </hlm-card-header>
    <div hlmCardContent>
      <hlm-field-group>
        <hlm-field>
          <label hlmFieldLabel>{{ t('Full name') }}</label>
          <input hlmInput [formField]="editForm.displayName" type="text" [placeholder]="t('Full name of principal')" />
          <a9-field-error [field]="editForm.displayName()"></a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel for="timezone">{{ t('Timezone') }}</label>
          <a9-input-timezone [formField]="editForm.timezone" [placeholder]="t('e.g. Europe/Zurich')"
            [empty]="t('No timezone(s) found')" />
          <a9-field-error [field]="editForm.color()">
            {{ t('Your current timezone, i.e. Asia/Bangkok, Europe/Berlin, ...') }}
          </a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Color') }}</label>
          <input hlmInput [formField]="editForm.color" type="color" colorspace="limited-srgb"
            [placeholder]="t('Color identifier')" />
          <a9-field-error [field]="editForm.color()">
            {{ t('Usage depends on client; format #rrggbbaa') }}
          </a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Description') }}</label>
          <textarea hlmTextarea [formField]="editForm.description" [placeholder]="t('Description')"
            class="min-h-16"></textarea>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Main e-mail address') }}</label>
          <input hlmInput [formField]="editForm.email" type="text" [placeholder]="t('Main e-mail address')" />
          <a9-field-error [field]="editForm.email()"></a9-field-error>
        </hlm-field>

        <a9-form-error [errors]="editForm().getError('serverError')"></a9-form-error>
      </hlm-field-group>
    </div>
    <hlm-card-footer>
      <button hlmBtn variant="default" [disabled]="editForm().submitting()" type="submit">{{ t('Save') }}</button>
      <button hlmBtn variant="ghost" (click)="back()" type="button">{{ t('Cancel') }}</button>
    </hlm-card-footer>
  </hlm-card>
</form>
