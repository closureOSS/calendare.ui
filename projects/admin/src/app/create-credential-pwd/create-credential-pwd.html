<a9-navigate-back-button></a9-navigate-back-button>
<form [formRoot]="editForm" *transloco="let t">
  <hlm-card class="max-w-3xl">
    <hlm-card-header>
      <h3 hlmCardTitle>{{ t('Create pwd credential for *username', {username: username()}) }}</h3>
    </hlm-card-header>
    <div hlmCardContent>
      <hlm-field-group>
        <hlm-field>
          <label hlmFieldLabel>{{ t('Username / Access Key') }}</label>
          <input hlmInput [formField]="editForm.username" type="text" [placeholder]="t('Username')"
            autocomplete="username">
          <a9-field-error [field]="editForm.username()">
            @if(!accesskey()) {
            {{ t('Choose username, e-mail or another unique identifier') }}
            }
          </a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Password') }}</label>
          <input hlmInput [formField]="editForm.password" type="password" autocomplete="current-password">
          <a9-field-error [field]="editForm.password()">
            {{ t('To generate a secure random password leave empty') }}
          </a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Confirm password') }}</label>
          <input hlmInput [formField]="editForm.passwordConfirm" type="password">
          <a9-field-error [field]="editForm.passwordConfirm()"></a9-field-error>
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel>{{ t('Description') }}</label>
          <input hlmInput [formField]="editForm.description" type="text" [placeholder]="t('Pwd_Description_Hint')">
          <a9-field-error [field]="editForm.description()">
            {{ t('Optional additional information') }}
          </a9-field-error>
        </hlm-field>
        <a9-form-error [errors]="editForm().getError('serverError')"></a9-form-error>
      </hlm-field-group>
    </div>
    <hlm-card-footer>
      <div hlmButtonGroup>
        <button hlmBtn variant="default" tabindex="0" type="submit">{{ t('Create') }}</button>
      </div>
    </hlm-card-footer>
  </hlm-card>
</form>
