<ng-container *transloco="let t">
  @if(mini()) {
  <button matMiniFab [matMenuTriggerFor]="menu" [disabled]="disabled()"><mat-icon svgIcon="add_card"></mat-icon></button>
  } @else {
  <button matFab extended [matMenuTriggerFor]="menu" [disabled]="disabled()"><mat-icon svgIcon="add_card"></mat-icon>{{ t('Credentials') }}</button>
  }

  <mat-menu #menu="matMenu">
    <button mat-menu-item [routerLink]="['/credential', 'create', username(), 'appkey']">{{ t('ApplicationKey') }}</button>
    <button mat-menu-item [routerLink]="['/credential', 'create', username(), 'pwd']" [queryParams]="{ accesskey: username()}">{{ t('Username/Password') }}</button>
    <button mat-menu-item [disabled]="!email()" [routerLink]="['/credential', 'create', username(), 'pwd']" [queryParams]="{ accesskey: email()}">{{ t('Email/Password') }}</button>
    <button mat-menu-item [routerLink]="['/credential', 'create', username(), 'pwd']">{{ t('Custom username') }}</button>
  </mat-menu>
</ng-container>
