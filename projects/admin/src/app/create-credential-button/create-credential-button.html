<ng-container *transloco="let t">
  <button hlmBtn variant="secondary" [hlmDropdownMenuTrigger]="menuCredentials" [disabled]="disabled()">
    <ng-icon name="matIdCardFillOutline" data-icon="inline-start" />
    {{ t('Credentials') }}
  </button>

  <ng-template #menuCredentials>
    <hlm-dropdown-menu class="min-w-60">
      <button hlmDropdownMenuItem [routerLink]="['/credential', 'create', username(), 'appkey']">{{ t('ApplicationKey')
        }}</button>
      <button hlmDropdownMenuItem [routerLink]="['/credential', 'create', username(), 'pwd']"
        [queryParams]="{ accesskey: username()}">{{ t('Username/Password') }}</button>
      <button hlmDropdownMenuItem [disabled]="!email()" [routerLink]="['/credential', 'create', username(), 'pwd']"
        [queryParams]="{ accesskey: email()}">{{ t('Email/Password') }}</button>
      <button hlmDropdownMenuItem [routerLink]="['/credential', 'create', username(), 'pwd']">{{ t('Custom username')
        }}</button>
    </hlm-dropdown-menu>
  </ng-template>
</ng-container>
