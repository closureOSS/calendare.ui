@let currLanguage = transloco.getActiveLang();
@for(language of transloco.getAvailableLangs(); track $index) {
<button hlmDropdownMenuCheckbox [checked]="currLanguage===language" (triggered)="setLanguage(language)" keepOpen="true">
  @switch(language) {
  @case('en') { English }
  @case('de') { Deutsch }
  @case('fr') { Français }
  @case('it') { Italiano }
  @default { 'Unknown' }
  }
  <hlm-dropdown-menu-checkbox-indicator />
</button>
}
