<hlm-alert [class]="boxClass()">
  <ng-icon [name]="svgIcon()" data-size="1.5rem" />
  <div hlmAlertTitle class="text-balance">
    <ng-content></ng-content>
  </div>
  @if(!compact()) {
  <div hlmAlertDescription [class]="bodyClass()">
    <ng-content select=".body" />
    @if(spinner()){
    <hlm-progress class="min-w-full bg-accent h-2 border border-primary/20 mbs-2 rounded-none">
      <hlm-progress-indicator class="bg-primary" />
    </hlm-progress>
    }
  </div>
  }
</hlm-alert>
