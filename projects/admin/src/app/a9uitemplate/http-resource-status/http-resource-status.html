<!--
Idle = 0,
Error = 1,
Loading = 2,
Reloading = 3,
Resolved = 4,
Local = 5
-->
@switch(status()) {
@case ('error') {
}
@case ('reloading')
@case ('loading') {
<hlm-progress class="min-w-full bg-accent h-2 border rounded-none">
  <hlm-progress-indicator class="bg-primary" />
</hlm-progress>
}
@case('resolved') {
}
@default {}
}
