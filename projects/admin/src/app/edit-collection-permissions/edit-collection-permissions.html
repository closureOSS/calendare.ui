<a9-navigate-back-button></a9-navigate-back-button>
<hlm-card *transloco="let t" class="max-w-4xl">
  <hlm-card-header>
    <h3 hlmCardTitle>
      {{t(collection.value()?.collectionType ?? 'Collection')}} {{collection.value()?.uri}}
    </h3>
  </hlm-card-header>

  <div hlmCardContent>
    @if(collection.value(); as collection) {
    <div class="permission-set">
      <div class="label">{{ t('Global - Public permissions to everybody') }}</div>
      <cal-edit-permissions [permissions]="globalPermitSelf()" (permissionsChange)="globalPermitSelf.set($event ?? 0)"
        [filter]="filter()"></cal-edit-permissions>
    </div>
    <div class="permission-set">
      <div class="label">{{ t('Prohibit for authorized users on inheritance') }}</div>
      <cal-edit-permissions [permissions]="authorizedProhibit()" [filter]="filter()"
        (permissionsChange)="authorizedProhibit.set($event ?? 0)" [prohibit]="true"></cal-edit-permissions>
    </div>
    <div class="permission-set">
      <div class="label">{{ t('Prohibit for owner') }} <span class="owner">{{collection.username}}</span></div>
      <cal-edit-permissions [permissions]="ownerProhibit()" [filter]="filter()"
        (permissionsChange)="ownerProhibit.set($event ?? 0)" [prohibit]="true"></cal-edit-permissions>
    </div>
    <!-- <pre class="debug">{{globalPermitSelf()}} | {{authorizedProhibit()}} | {{ownerProhibit()}} </pre> -->
    }
  </div>

  <hlm-card-footer>
    <hlm-button-group>
      <button hlmBtn variant="default" [disabled]="!dirty()" (click)="submit()" type="button">{{ t('Save') }}</button>
      <button hlmBtn variant="ghost" type="reset" size="icon" (click)="refresh()" [title]="t('Reset')">
        <ng-icon name="matRestartAltOutline" />
      </button>
    </hlm-button-group>
  </hlm-card-footer>
</hlm-card>
