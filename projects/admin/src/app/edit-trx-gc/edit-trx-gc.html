<hlm-item variant="outline" class="max-w-2xl" *transloco="let t">
  <hlm-item-content>
    <hlm-item-title>{{ t('Garbage collection file storage') }}</hlm-item-title>
    <p hlmItemDescription>{{ t('Deletes all files in the external S3 or local storage which are no longer referenced') }}</p>
  </hlm-item-content>
  <hlm-item-actions>
    <button hlmBtn variant="destructive" (click)="collectGarbage()" size="sm">{{ t('Clean') }}</button>
  </hlm-item-actions>
</hlm-item>
