<div class="grid w-full min-h-svh lg:grid-cols-2 overflow-y-auto bg-muted/50" *transloco="let t">
  <div class="flex flex-col min-h-full gap-4 p-4 md:p-10">
    <div class="flex justify-center md:justify-start gap-2 p-2">
      <a routerLink="." class="flex items-center gap-2 font-medium text-primary">
        <div class="flex size-10 items-center justify-center">
          <img src="icon.svg" alt="Logo" class="object-contain">
        </div>
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium text-xl">{{ t('closure.ch') }}</span>
          <span class="truncate text-xs -mt-1">{{ t('Open Source Software') }}</span>
        </div>
      </a>
    </div>
    <div class="flex flex-1 items-center justify-center py-6 @container">
      <router-outlet></router-outlet>
    </div>
    <div class="justify-center flex gap-4 mt-auto">
      <a9-theme-switcher-button></a9-theme-switcher-button>
      <a9-language-switcher-button></a9-language-switcher-button>
    </div>
  </div>
  <div class="bg-muted relative hidden lg:block">
    <img src="session.svg" alt="Intro image" class="absolute inset-0 h-full w-full object-cover object-bottom-right opacity-75" />
  </div>
</div>
