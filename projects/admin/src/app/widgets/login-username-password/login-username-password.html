<form class="a9-form" [formRoot]="editForm" *transloco="let t">
  <hlm-field-group>
    <hlm-field>
      <label hlmFieldLabel>{{ t('Username / Access Key') }}</label>
      <input hlmInput [formField]="editForm.username" type="text" [placeholder]="t('Username')" autocomplete="username">
      <a9-field-error [field]="editForm.username()"></a9-field-error>
    </hlm-field>

    <hlm-field>
      <label hlmFieldLabel>{{ t('Password') }}</label>
      <input hlmInput [formField]="editForm.password" type="password" autocomplete="current-password">
      <a9-field-error [field]="editForm.password()"></a9-field-error>
    </hlm-field>

    <a9-form-error [errors]="editForm().getError('serverError')"></a9-form-error>
  </hlm-field-group>
  <hlm-button-group>
    <button hlmBtn variant="default" type="submit">
      @if(loginLabel()) { {{ loginLabel() }}} @else { {{ t('Login') }} }
    </button>
    @if(hasReset()) {
    <button hlmBtn variant="outline" size="icon" type="reset">
      <ng-icon name="matRestartAltOutline" />
    </button>
    }
    <ng-content></ng-content>
  </hlm-button-group>
</form>
