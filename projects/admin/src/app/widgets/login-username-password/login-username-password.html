<form class="a9-form" [formRoot]="editForm" *transloco="let t">
  <mat-form-field>
    <mat-label>{{ t('Username / Access Key') }}</mat-label>
    <input matInput [formField]="editForm.username" type="text" [placeholder]="t('Username')" autocomplete="username">
    <mat-error [field]="editForm.username()"></mat-error>

  </mat-form-field>
  <mat-form-field>
    <mat-label>{{ t('Password') }}</mat-label>
    <input matInput [formField]="editForm.password" type="password" autocomplete="current-password">
    <mat-error [field]="editForm.password()"></mat-error>
  </mat-form-field>
  @if(editForm().getError('serverError')) {
  <a9-hint-box class="a9-form-msg" mode="error" [slim]="true">{{ editForm().getError('serverError')?.message
    }}</a9-hint-box>
  }
  <a9-action-bar>
    <button matButton="filled" type="submit">@if(loginLabel()) { {{ loginLabel() }}} @else { {{ t('Login') }} }</button>
    @if(hasReset()) {
    <button matIconButton type="reset"><mat-icon svgIcon="restart_alt"></mat-icon></button>
    }
    <ng-content></ng-content>
  </a9-action-bar>
</form>
