<div class="flex w-full flex-wrap justify-left gap-2" [class]="{'prohibit': prohibit()}">
  @for(perm of permissionList(); track perm) {
  <div hlmBadge class="min-w-20"
    [class]="{'rounded-none': perm === 'None', 'rounded-tr-lg': perm === 'All', 'bg-allow': !prohibit(), 'bg-prohibit': prohibit(), 'text-allow-foreground': !prohibit(), 'text-prohibit-foreground': prohibit()}">{{ perm }}</div>
  }
</div>
