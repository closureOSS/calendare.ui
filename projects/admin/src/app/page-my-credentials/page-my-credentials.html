<article *transloco="let t">
  <a9-site-title>{{ t('Credentials') }}</a9-site-title>

  <section>
    @if(username(); as username) {
    <cal-view-credentials [username]="username"></cal-view-credentials>
    <a9-floating-action-bar>
      <cal-create-credential-button [username]="username" [email]="email()"></cal-create-credential-button>
    </a9-floating-action-bar>
    }
  </section>
</article>
